name: Build Forge mod
on:
  workflow_dispatch:
  push:
    branches: [ principal, main, master ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: |
          unzip -q Drag-n-Ball-AF_repo_listo.zip -d project
          ls project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --no-daemon -p project
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: legacy-of-the-saiyans-forge-1.20.1
          path: project/build/libs/*.jar
          if-no-files-found: error
